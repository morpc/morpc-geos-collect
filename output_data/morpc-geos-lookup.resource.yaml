title: Identifiers for geographies of interest to MORPC
description: 'This table provides the identifiers and metadata for a set of geographies
  for the MORPC 15-county region derived from several sources. The geographies themselves
  are available in an associated geopackage. For more information, see the morpc-geos-collect
  workflow.  Identifiers are included for the following geographies: JURIS, CBSA,
  REGIONCORPO, REGION7, REGION10, COUNTY-TOWNSHIP-REMAINDER, PLACE, URBANAREA, JURIS-COUNTY,
  COUNTY, REGIONTDM-MORPC, REGIONMPO-MORPC, COUNTY-COUSUB, UNSD, REGION15, COUNTY-MORPC,
  JURIS-MORPC, PLACE-COUNTY, REGIONSWACO, REGIONONECBUS, REGIONCEDS, JURIS-COUNTY-MORPC'
