description: 'This table provides the identifiers and metadata for a set of geographies
  for the MORPC 15-county region derived from several sources. The geographies themselves
  are available in an associated geopackage. For more information, see the morpc-geos-collect
  workflow.  Identifiers are included for the following geographies: JURIS, URBANAREA,
  PLACE, PLACE-COUNTY, COUNTY-MORPC, REGIONCORPO, LIBRARYD, CBSA, UNSD, COUNTY, REGIONSWACO,
  COUNTY-TOWNSHIP-REMAINDER, REGIONONECBUS, REGION7, REGION15, REGIONCEDS, JURIS-COUNTY,
  REGIONMPO-MORPC, REGION10, REGIONTDM-MORPC, JURIS-COUNTY-MORPC, COUNTY-COUSUB, JURIS-MORPC'
